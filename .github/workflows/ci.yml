name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-ci-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-ci-

      - name: Resolve the installed Windows SDK metadata version
        shell: pwsh
        run: |
          # Same as the release workflow: cswinrt reads the Windows SDK that is installed on the runner.
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $platform = Get-ChildItem (Join-Path $kits 'Platforms\UAP') -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'Platform.xml') } |
            Sort-Object { [version]$_.Name } |
            Select-Object -Last 1
          "CsWinRTWindowsMetadata=$($platform.Name)" >> $env:GITHUB_ENV

      - name: Build app
        run: dotnet build src/app/Gitxen/Gitxen.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -v:m

      - name: Build gx
        run: dotnet build src/app/Gitxen.Cli/Gitxen.Cli.csproj -c Release -r win-x64 -v:m

      - name: Test
        run: dotnet test src/app/Gitxen.Tests/Gitxen.Tests.csproj -c Release -r win-x64 -v:m
